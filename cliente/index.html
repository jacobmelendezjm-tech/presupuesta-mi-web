<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf4ec" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Configura tu web y mírala construirse en 3D mientras el servidor calcula tu presupuesto con tarifas claras." />
    <title>Presupuesta mi web</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23fbf4ec'/%3E%3Cg transform='translate(4 9) scale(.52)' fill='none'%3E%3Cpath d='M3 18a5 5 0 0 0 10 0V3M19 23V3l8 11 8-11v20' stroke='%233b2a22' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='42' cy='21' r='3' fill='%23a8492f'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Playfair Display para titulares y cifras; Inter para el texto y los rótulos -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        if (localStorage.getItem("presupuesta-mi-web-tema") === "oscuro") {
          document.documentElement.dataset.tema = "oscuro";
          document.documentElement.style.colorScheme = "dark";
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", "#1f1814");
        }
      } catch {}
    </script>
    <!-- Evita el destello blanco antes de que cargue el CSS -->
    <style>html, body { background: var(--fondo, #fbf4ec); }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
